apis:
- name: OSSIO Site MCP Server
  description: >-
    An OAuth-protected Model Context Protocol server mounted on OSSIO's WordPress
    corporate site at /wp-json/mcp/mcp-oauth-server, discoverable through the site's RFC
    9728 protected-resource document. It exposes site content and WordPress abilities to
    agents; it is not an OSSIOfiber product API. tools/list returns HTTP 401 anonymously,
    so the tool surface is auth-gated and was not enumerated.
  humanURL: https://ossio.io/
