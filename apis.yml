aid: ossio
name: OSSIO
description: >-
  OSSIO is an orthopedic fixation medical device company headquartered in Woburn,
  Massachusetts and founded in Israel in 2014. It develops and sells OSSIOfiber, a
  bio-integrative, metal-free implant material used for screws, suture anchors, staples,
  bone pins and trimmable fixation nails in foot and ankle, hand and wrist, sports
  medicine and pediatric procedures. OSSIO ships physical implants, not software, and
  publishes no developer program, no product API and no OpenAPI. Its one machine-readable
  surface is the corporate website itself: ossio.io runs WordPress with the MCP Adapter
  installed, exposing an OAuth-protected Model Context Protocol server plus RFC 8414 and
  RFC 9728 metadata documents at /.well-known/ — a site-content agent surface, not a
  product API.
